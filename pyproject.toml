[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "slidetwin"
dynamic = ["version", "readme"]
description = "Agent-operable digital pathology viewer simulator (research prototype, not for clinical use)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Wenhao Zhang" }, { name = "Zhongliang Zhou" }, { name = "Sheng Li" }]
maintainers = [{ name = "Wenhao Zhang", email = "bdu8us@virginia.edu" }]
keywords = ["digital pathology", "whole-slide image", "agents", "simulator", "MCP", "reinforcement learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
  "httpx2>=2.10",
  "jsonschema>=4.20",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "tiffslide>=4.0",
  "tifffile>=2026.6",
  "imagecodecs>=2026.1",
  "zarr>=3.1",
  "wsidicom>=0.36.1",
  "pydicom>=3.0",
  "czifile>=2026.10.14",
]

[project.urls]
Homepage = "https://github.com/wenhaozhang0066/SlideTwin"
Documentation = "https://github.com/wenhaozhang0066/SlideTwin#readme"
Issues = "https://github.com/wenhaozhang0066/SlideTwin/issues"
Changelog = "https://github.com/wenhaozhang0066/SlideTwin/blob/main/CHANGELOG.md"
Blog = "https://wenhaozhang0066.github.io/SlideTwin/"

[project.scripts]
slidetwin = "slidetwin.cli:main"

[project.optional-dependencies]
openslide = ["openslide-python>=1.4", "openslide-bin>=4.0.1.1"]
slideio = ["slideio==2.10.0"]
isyntax = ["pyisyntax==0.1.7"]
all = ["slidetwin[openslide,slideio,isyntax]"]
llm = ["anthropic>=1.15,<2"]
e2e = ["playwright>=1.45"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "anthropic>=1.15,<2",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
  "openslide-python>=1.4",
  "openslide-bin>=4.0.1.1",
  "slideio==2.10.0",
  "pyisyntax==0.1.7",
]

[tool.hatch.version]
path = "slidetwin/__init__.py"

# The README for PyPI: the repository's README.md with its relative links made absolute (GitHub
# shows the relative ones, PyPI cannot resolve them).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/media/[^)\s]+)\)'
replacement = '](https://raw.githubusercontent.com/wenhaozhang0066/SlideTwin/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/wenhaozhang0066/SlideTwin/blob/main/\1)'

[tool.hatch.build.targets.wheel]
# The profiles, protocols and public manifests travel with the code, as slidetwin/configs. Unlike
# force-include, this mapping keeps the .gitignore rules: an ignored file in configs/ stays out.
only-include = ["slidetwin", "configs"]
sources = { "configs" = "slidetwin/configs" }

[tool.hatch.build.targets.sdist]
include = [
  "slidetwin",
  "configs",
  "third_party",
  "tests",
  "scripts",
  "docs",
  "README.md",
  "README_zh.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "cache", "logs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
# Error classes are named after the condition (e.g. SlideNotFound), not suffixed with "Error".
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiffslide.*", "openslide.*", "tifffile.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300  # pytest-timeout: a test stuck this long fails with every thread's stack
markers = [
  "testdata: needs test slides fetched by scripts/fetch_test_data.py",
  "camelyon: needs local CAMELYON16 slides (set SLIDETWIN_CAMELYON_DIR)",
  "e2e: drives the web UI in headless Chromium (needs the e2e extra and a browser build)",
]

[tool.coverage.run]
branch = true
source = ["slidetwin/core", "slidetwin/readers"]
source_pkgs = ["slidetwin.env", "slidetwin.cli", "slidetwin.scan"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]
