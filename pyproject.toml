[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slidetwin"
dynamic = ["version"]
description = "Agent-operable digital pathology viewer simulator (research prototype, not for clinical use)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SlideTwin contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
  "httpx2>=2.10",
  "jsonschema>=4.20",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "tiffslide>=4.0",
  "tifffile>=2026.6",
  "imagecodecs>=2026.1",
  "zarr>=3.1",
  "wsidicom>=0.36.1",
  "pydicom>=3.0",
  "czifile>=2026.10.14",
]

[project.scripts]
slidetwin = "slidetwin.cli:main"

[project.optional-dependencies]
openslide = ["openslide-python>=1.4", "openslide-bin>=4.0.1.1"]
slideio = ["slideio==2.10.0"]
isyntax = ["pyisyntax==0.1.7"]
all = ["slidetwin[openslide,slideio,isyntax]"]
llm = ["anthropic>=1.15,<2"]
e2e = ["playwright>=1.45"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "anthropic>=1.15,<2",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
  "openslide-python>=1.4",
  "openslide-bin>=4.0.1.1",
  "slideio==2.10.0",
  "pyisyntax==0.1.7",
]

[tool.hatch.version]
path = "slidetwin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["slidetwin"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "slidetwin/configs"  # profiles, protocols and public manifests travel with the code

[tool.hatch.build.targets.sdist]
include = [
  "slidetwin",
  "configs",
  "third_party",
  "tests",
  "scripts",
  "docs",
  "README.md",
  "README_zh.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "cache", "logs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
# Error classes are named after the condition (e.g. SlideNotFound), not suffixed with "Error".
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiffslide.*", "openslide.*", "tifffile.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300  # pytest-timeout: a test stuck this long fails with every thread's stack
markers = [
  "testdata: needs test slides fetched by scripts/fetch_test_data.py",
  "camelyon: needs local CAMELYON16 slides (set SLIDETWIN_CAMELYON_DIR)",
  "e2e: drives the web UI in headless Chromium (needs the e2e extra and a browser build)",
]

[tool.coverage.run]
branch = true
source = ["slidetwin/core", "slidetwin/readers"]
source_pkgs = ["slidetwin.env", "slidetwin.cli", "slidetwin.scan"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]
