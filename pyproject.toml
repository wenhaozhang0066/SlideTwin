[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slidetwin"
dynamic = ["version"]
description = "Agent-operable digital pathology viewer simulator (research prototype, not for clinical use)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SlideTwin contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "tiffslide>=3.0",
]

[project.optional-dependencies]
openslide = ["openslide-python>=1.4", "openslide-bin>=4.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
  "tifffile>=2024.1",
  "openslide-python>=1.4",
  "openslide-bin>=4.0",
]

[tool.hatch.version]
path = "slidetwin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["slidetwin"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "cache", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tiffslide.*", "openslide.*", "tifffile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "testdata: needs the CC0 test slide fetched by scripts/fetch_test_data.py",
  "camelyon: needs local CAMELYON16 slides (set SLIDETWIN_CAMELYON_DIR)",
]
filterwarnings = [
  # Starlette suggests the httpx2 fork for its TestClient; plain httpx still works.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["slidetwin/core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
