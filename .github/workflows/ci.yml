name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache test slide
        uses: actions/cache@v4
        with:
          path: data/testdata
          key: testdata-${{ hashFiles('scripts/fetch_test_data.py') }}
      - name: Fetch test slide (CC0, 1.9 MB)
        run: python scripts/fetch_test_data.py
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy slidetwin
      - name: Tests
        env:
          SLIDETWIN_REQUIRE_TESTDATA: "1"
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=100

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: UI unit tests
        run: node --test tests/web/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          SLIDETWIN_REQUIRE_E2E: "1"
        run: pytest -q tests/e2e
