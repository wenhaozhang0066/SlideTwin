# Slide manifest. Paths are relative to SLIDETWIN_SLIDE_DIR (default ./data/slides); no internal
# paths belong here. `eval_only` blocks are for evaluation scripts: the core loader deletes them, so
# they are never reachable through a session action, an API response or a log.
# Slide ids are what every reader sees, so they must be opaque: the loader refuses an id, license or
# attribution that contains an eval_only value. CAMELYON ids are "c16_" + the first 6 hex digits of
# the file's sha256. `path` and `source_url` stay on the server.
# Sources and licenses: docs/DATA_LICENSES.md.
